# repograph's own config for indexing itself. It sets every key to the shipped
# default (see src/config.rs), so it also serves as the worked example the
# README's Configure section walks through.
doc_globs = ["**/*.md"]
code_globs = ["**/*.ts", "**/*.tsx"]
skip = ["**/node_modules/**", "**/dist/**", "**/TRACKER.md", "graphify-out/**", ".repograph/**"]
registries = ["docs/constitution.yaml"]

# Id prefixes to recognise. Deliberately strict — ambiguous one-letter families
# collide with ordinary prose and are left out. This is beauty-crm's census,
# not a generic default; a different repository should list its own families.
id_families = [
  "FR-DM", "FR-CAL", "FR-VIS", "FR-PAY", "FR-PH", "FR-SEC", "FR-APP", "FR-MKT",
  "FR-AI", "FR-CRM", "FR-SHELL", "FR-TOOL", "FR-SVC", "FR-LIFE", "FR-WH", "FR-RPT",
  "FR-MIG", "FR-WEB", "FR-OPS", "FR-STAFF",
  "NFR-PH", "NFR-MKT", "NFR-MIG", "NFR-PAY", "NFR-DM", "NFR-RPT", "NFR-WEB", "NFR-SVC", "NFR-STAFF", "NFR",
  "AC-DM", "AC-VIS", "INV", "ADR", "OD", "OQ", "N", "R", "M", "W", "D", "G",
  "PREP", "CAL", "OR", "MON", "SEAM", "SG", "IDEA",
]
milestone_families = ["BE", "FE", "PLAT", "SYNC", "OPS", "AI", "MOB"]

# The two stages that spend model tokens, both opt-in (`repograph enrich`,
# `ask --rerank`). Each is a shell command that reads its prompt on stdin;
# `enrich` expects `id<TAB>question` lines back, `rerank` the chosen ids one
# per line. Both parsers ignore every line they do not recognise, so a command
# that prints a transcript around its answer still works. Headless Claude Code
# with thinking off answers the same 4-5x faster;
# `{model}` is filled from the model key below, so choosing one is a word rather than a
# rewritten command line; a command naming no `{model}` is run exactly as written.
enrich_command = "MAX_THINKING_TOKENS=0 claude -p --model {model} --output-format text --tools \"\" --setting-sources \"\" --no-session-persistence"
rerank_command = "MAX_THINKING_TOKENS=0 claude -p --model {model} --output-format text --tools \"\" --setting-sources \"\" --no-session-persistence"

# Nothing here is Claude-only. OpenAI's Codex CLI reads its instructions from stdin when no
# prompt argument is given, and needs `-o` because plain stdout is the run's transcript rather
# than the answer (read from `codex exec --help`, never run here):
# rerank_command = "codex exec --skip-git-repo-check -m {model} -o /dev/stdout"
# A model on the machine, or any API behind a five-line script — both shapes, unmeasured:
# rerank_command = "ollama run {model} --hidethinking"
# rerank_command = "python3 tools/rerank-via-some-api.py --model {model}"

# `enrich` wants cheap, multilingual and obedient to a line format: haiku's questions read
# paraphrase 15/30 and the developer suite's `rule` 5/9 where a stronger model reads 17/30 and
# 2/9 — the register beats the model, and 8-way over ~2k nodes costs ~$2.5. `--rerank` wants
# reading comprehension over 200 near-duplicate candidates in ~14-19k mostly Cyrillic tokens:
# sonnet reads paraphrase 29/30 of the 82 cases, haiku 11/14 of the older set, opus 14/14
# paraphrase but 23/24 keyword. Set once for the machine instead in
# ~/.config/repograph/config.toml, or for one run with REPOGRAPH_ENRICH_MODEL.
enrich_model = "haiku"
rerank_model = "sonnet"

# `ask --rerank-local`: a local cross-encoder over the same 200-deep pool, zero tokens. Empty
# means ~/.cache/repograph/reranker, where `optimum-cli export onnx` was pointed. Measured and
# rejected against a bar of one second: 17.9 s a question, and keyword 39/40 — for tokens being
# impossible, not for tokens being expensive.
reranker_dir = ""

# A store records the model its vectors were written with and `ask` opens that one, so this key
# decides only what new rows are written with, not what an existing store answers by. The small
# model is the default because a first build pays for the model before anyone knows whether they
# need its recall; swap in "intfloat/multilingual-e5-large" for paraphrase 22/30 against 15/30, a
# 2.1 GB download and nine times the wall on a whole-store embed
# (docs/adr/ADR-002-two-defaults-multiplied.md).
embed_model = "intfloat/multilingual-e5-small"
