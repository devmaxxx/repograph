name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { components: clippy }
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `secrets` is not readable from a job-level `if`; a step output is.
      - id: token
        run: echo "present=${{ secrets.BENCH_REPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: olkp1/beauty-crm
          token: ${{ secrets.BENCH_REPO_TOKEN }}
          path: corpus
      - if: steps.token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@1.98.0
      - if: steps.token.outputs.present == 'true'
        run: cargo build --release
      - if: steps.token.outputs.present == 'true'
        run: ./target/release/repograph --repo corpus --no-dense build
      - if: steps.token.outputs.present == 'true'
        run: ./target/release/repograph --repo corpus --no-dense bench
      # A green job that ran nothing would read as a passed bench.
      - if: steps.token.outputs.present != 'true'
        run: echo "::warning::BENCH_REPO_TOKEN is not set; the bench did not run"

  windows:
    runs-on: windows-latest
    steps:
      # The repository is LF throughout and the tests compare bytes; a checkout the runner's
      # git had converted to CRLF would be a different corpus.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { components: clippy }
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # A default Git for Windows install puts `git` on PATH and not `sh`; the runner image has
      # both. This is a user's box: Git's shell directories are taken off PATH, and the tests that
      # spawn the shell are run again.
      - shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\(usr\\)?bin\\?$' }) -join ';'
          if (Get-Command sh -ErrorAction SilentlyContinue) { throw "sh is still on PATH: $((Get-Command sh).Source)" }
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw "git left PATH too; the pattern is wrong" }
          cargo test -- enrich:: rerank::
