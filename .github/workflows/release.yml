name: release
on:
  push:
    tags: ['v*']
  # A run from a branch builds, smokes and packs every target and publishes nothing, so a
  # platform new to the matrix is proven on a runner before a version number is spent on it.
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    # New repos default GITHUB_TOKEN to read-only; softprops/action-gh-release's own
    # README states it needs contents: write to create a release and upload assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf repograph-${{ matrix.target }}.tar.gz repograph
      # Run once before it is packed: the ONNX Runtime this links on Windows is pyke's DirectML
      # build and imports a DLL nothing here ships, so a binary that cannot load says so in this
      # log, on a runner carrying only the inbox copy, rather than on a user's machine.
      - if: runner.os == 'Windows'
        run: |
          .\target\${{ matrix.target }}\release\repograph.exe --version
          Compress-Archive -Path .\target\${{ matrix.target }}\release\repograph.exe -DestinationPath repograph-${{ matrix.target }}.zip
      # A dispatch run has no release to put the archive on. It is kept as a run artifact instead,
      # so the file a runner just built and smoked can be fetched with `gh run download` and tried
      # on a real machine before a tag is spent; a tag run skips this and publishes as it did.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: repograph-${{ matrix.target }}
          path: repograph-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "repograph-${{ matrix.target }}.${{ matrix.ext }}" }
  # The npm launcher and its three platform packages are cut from the release assets above, so the
  # binary a `pnpm add` fetches is byte-for-byte the one on the release page. They go to GitHub
  # Packages under the @devmaxxx scope, which the repository's own GITHUB_TOKEN may write to, so
  # there is no registry secret to keep; scripts/npm-pack.sh packs the same tarballs by hand.
  npm:
    needs: build
    # Only a tag has a release to download from and a version to publish under.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@devmaxxx"
      - run: gh release download "$GITHUB_REF_NAME" --pattern 'repograph-*.tar.gz' --pattern 'repograph-*.zip'
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: |
          mkdir -p bin/darwin-arm64 bin/linux-x64 bin/win32-x64
          tar -C bin/darwin-arm64 -xzf repograph-aarch64-apple-darwin.tar.gz
          tar -C bin/linux-x64 -xzf repograph-x86_64-unknown-linux-gnu.tar.gz
          unzip -q repograph-x86_64-pc-windows-msvc.zip -d bin/win32-x64
          scripts/npm-pack.sh "${GITHUB_REF_NAME#v}" darwin-arm64=bin/darwin-arm64/repograph linux-x64=bin/linux-x64/repograph win32-x64=bin/win32-x64/repograph.exe
      # The launcher goes last: until its platform packages exist, an install of it resolves nothing.
      - run: |
          for t in dist/npm/*-arm64-*.tgz dist/npm/*-x64-*.tgz; do npm publish "$t"; done
          npm publish dist/npm/devmaxxx-repograph-"${GITHUB_REF_NAME#v}".tgz
