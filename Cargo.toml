[package]
name = "repograph"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
clap = { version = "=4.6.6", features = ["derive"] }
fastembed = "=6.0.2"
ignore = "=0.4.33"
rayon = "=1.12.0"
regex = "=1.13.1"
rust-stemmers = "=1.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
streaming-iterator = "=0.1.9"
toml = "=1.1.4"
tree-sitter = "=0.27.0"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
